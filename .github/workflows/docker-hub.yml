name: Docker Hub image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build release image
        run: docker build --tag "rustscope:$GITHUB_SHA" .

      - name: Publish to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set the DOCKERHUB_TOKEN repository secret to enable publishing.'
            exit 1
          fi
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="docker.io/$DOCKERHUB_USERNAME/rustscope"
          docker tag "rustscope:$GITHUB_SHA" "$image:sha-$GITHUB_SHA"
          docker tag "rustscope:$GITHUB_SHA" "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
