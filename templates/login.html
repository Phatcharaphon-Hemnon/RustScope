{% extends "base.html" %}
{% block title %}Sign in · RustScope{% endblock %}
{% block content %}
<div class="auth-layout">
<section class="login-card">
<h1>Sign in</h1>
<form action="/login" method="post" class="stack">
  <label>Username <input name="user" value="{{ user }}" {% if !error.is_empty() %}aria-describedby="auth-error" aria-invalid="true"{% endif %} autocomplete="username" required></label>
  <label>Password <input name="password" type="password" {% if !error.is_empty() %}aria-describedby="auth-error" aria-invalid="true"{% endif %} autocomplete="current-password" required></label>
  {% if !error.is_empty() %}<p id="auth-error" role="alert" tabindex="-1" autofocus>⚠ {{ error }}</p>{% endif %}
  <button class="w-full">Sign in</button>
</form>
<p>New to RustScope? <a href="/register">Create account</a></p>
</section>
<p class="statement">Assess a release.<br>Review the evidence.</p></div>
{% endblock %}
