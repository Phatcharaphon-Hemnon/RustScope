<details class="report-reference"{% if full %} open{% endif %}>
<summary>References</summary>
<dl>
<dt>OWASP category</dt><dd>{{ rule.category }}</dd>
<dt>Rule version</dt><dd>{{ rule.version }}</dd>
<dt>Evidence</dt><dd>{{ rule.inputs }}</dd>
<dt>Decision criteria</dt><dd>{{ rule.evidence }}</dd>
<dt>Confidence</dt><dd>{{ rule.confidence }}</dd>
<dt>Closure criteria</dt><dd>{{ rule.closure }}</dd>
</dl>
</details>
